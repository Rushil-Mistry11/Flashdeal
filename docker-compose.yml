services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "15672:15672"   # management UI (guest / guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  mongo:
    image: mongo:7
    ports:
      - "27018:27017"   # MongoDB Compass: mongodb://localhost:27018  (27018 avoids clashing with a local MongoDB)
    volumes:
      - mongo-data:/data/db   # data survives `docker compose down` (use `down -v` to wipe it)
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  # One-shot job: creates collections, validators, indexes and seeds the catalogue. Exits when done.
  migrate:
    build: ./db
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - MONGO_DB=flashdeal
    depends_on:
      mongo: { condition: service_healthy }
    restart: "no"

  catalog-service:
    build: ./catalog-service
    restart: unless-stopped
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - MONGO_DB=flashdeal
    depends_on:
      mongo: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-gateway:
    build: ./api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - SERVICE_NAME=api-gateway
      - REDIS_URL=redis://redis:6379
      - RABBIT_URL=amqp://guest:guest@rabbitmq:5672
      - MONGO_URL=mongodb://mongo:27017
      - MONGO_DB=flashdeal
      - CATALOG_SERVICE_URL=http://catalog-service:4000
      - RATE_LIMIT_CAPACITY=10          # bucket size (burst)
      - RATE_LIMIT_REFILL_PER_SEC=5     # sustained requests/sec per client IP
      - CACHE_TTL_SEC=3                 # how long the deals list is cached in Redis
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mongo: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      catalog-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: ./worker
    restart: unless-stopped
    environment:
      - SERVICE_NAME=worker
      - REDIS_URL=redis://redis:6379
      - RABBIT_URL=amqp://guest:guest@rabbitmq:5672
      - MONGO_URL=mongodb://mongo:27017
      - MONGO_DB=flashdeal
      - WORKER_PREFETCH=5               # concurrent claims per worker
      - PROCESSING_MS_MIN=150           # simulated payment / validation latency
      - PROCESSING_MS_MAX=400
      - FAIL_RATE=0                     # e.g. 0.3 = 30% simulated failures (shows retry + dead-letter queue)
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mongo: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - api-gateway

volumes:
  mongo-data:
